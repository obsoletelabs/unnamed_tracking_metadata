services:
  atlas:
    build: .
    container_name: atlas-metadata
    restart: unless-stopped
    ports:
      - "${ATLAS_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-Atlas Metadata}
      AUTHORITY_MODE: ${AUTHORITY_MODE:-local}
      AUTHORITY_INSTANCE_ID: ${AUTHORITY_INSTANCE_ID:-}
      CENTRAL_AUTHORITY_URL: ${CENTRAL_AUTHORITY_URL:-}
      AUTHORITY_SYNC_INTERVAL_SECONDS: ${AUTHORITY_SYNC_INTERVAL_SECONDS:-900}
      PUBLISH_CONTRIBUTIONS: ${PUBLISH_CONTRIBUTIONS:-false}
      REDIS_URL: ${REDIS_URL:-}
      API_MAX_BODY_BYTES: ${API_MAX_BODY_BYTES:-1048576}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-120}
      API_RATE_WINDOW_SECONDS: ${API_RATE_WINDOW_SECONDS:-60}
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-86400}
      IDEMPOTENCY_MAX_RESPONSE_BYTES: ${IDEMPOTENCY_MAX_RESPONSE_BYTES:-1048576}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/atlas.db}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-before-sharing}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      UPLOAD_DIR: /data/uploads
      MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
      MEDIA_LOCAL_ROOT: ${MEDIA_LOCAL_ROOT:-/data/media}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-auto}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
    volumes:
      - atlas_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  atlas_data:
