services:
  atlas:
    build: .
    container_name: atlas-metadata
    restart: unless-stopped
    ports:
      - "${ATLAS_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-Atlas Metadata}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/atlas.db}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-before-sharing}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      UPLOAD_DIR: /data/uploads
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
    volumes:
      - atlas_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  atlas_data:
