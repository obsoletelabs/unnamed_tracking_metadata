[project]
name = "atlas-metadata"
version = "2.0.0.dev0"
description = "Semi-distributed media metadata server"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pydantic-settings>=2.4,<3.0",
  "httpx>=0.27,<1.0",
  "certifi>=2026.10.19",
  "cryptography>=43",
  "psycopg[binary]>=3.2,<4.0",
  "Pillow>=13.0,<14.0",
  "jinja2>=3.1,<4.0",
  "markdown-it-py>=3.0,<5.0",
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pgserver>=0.1"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[project.scripts]
atlas = "atlas.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
atlas = ["migrations/script.py.mako", "web/templates/*.html", "web/static/*", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "federation_lab: multi-node federation scenarios on real servers (opt-in: python -m tools.federation_lab)",
]

[tool.ruff]
line-length = 125
target-version = "py312"
extend-exclude = ["legacy", "tools/compat"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tools/gen_docs.py" = ["E501", "B007"]  # prose tables
"tests/test_docs.py" = ["E501"]
