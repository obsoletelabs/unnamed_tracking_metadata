{% extends "base.html" %}
{% from "macros.html" import csrf %}
{% block title %}Field · {{ app_name }}{% endblock %}
{% block content %}
<h1>Administration</h1>
{% include "_adminnav.html" %}
<p><a href="/admin/schema/{{ t.key }}">&larr; {{ t.label }}</a></p>
<form class="card" method="post" action="/admin/schema/{{ t.key }}/fields">{{ csrf(p.csrf) }}
  <label for="key">Key <span class="hint">a-z, 0-9, _ — can't change later</span></label>
  <input id="key" type="text" name="key" value="{{ row.key if row else '' }}" {{ 'readonly' if row }} required maxlength="40" pattern="[a-z][a-z0-9_]*">
  <label for="label">Label</label><input id="label" type="text" name="label" value="{{ row.label if row else '' }}" required maxlength="80">
  <label for="kind">Kind</label>
  {% if row %}<input type="hidden" name="kind" value="{{ row.kind }}"><input type="text" value="{{ row.kind }}" readonly>
  {% else %}<select id="kind" name="kind">{% for k in kinds %}<option>{{ k }}</option>{% endfor %}</select>{% endif %}
  <label for="choices">Options <span class="hint">for “choice” fields: one per line</span></label>
  <textarea id="choices" name="choices">{{ (row.choices if row else [])|join('\n') }}</textarea>
  <label for="help">Help text <span class="hint">shown under the input</span></label><input id="help" type="text" name="help" value="{{ row.help if row else '' }}" maxlength="300">
  <div class="cols"><div><label for="position">Order</label><input id="position" type="text" inputmode="numeric" name="position" value="{{ row.position if row else 100 }}"></div>
  <div><label><input type="checkbox" name="public" {{ 'checked' if (not row) or row.public }}> Show on pages and in the API</label>
  <label><input type="checkbox" name="editable" {{ 'checked' if (not row) or row.editable }}> Contributors may propose changes</label></div></div>
  <p><button type="submit">Save field</button> <a class="btn secondary" href="/admin/schema/{{ t.key }}">Cancel</a></p>
</form>
{% endblock %}
