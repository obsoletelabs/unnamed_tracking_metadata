{% macro csrf(token) %}<input type="hidden" name="csrf" value="{{ token }}">{% endmacro %}
{% macro chips(items) %}{% if items %}<ul class="chips">{% for i in items %}<li class="chip">{{ i }}</li>{% endfor %}</ul>{% endif %}{% endmacro %}
{% macro cover(g, art) %}{% if art.get(g.id) %}<img src="/media/{{ art[g.id] }}" alt="" loading="lazy">{% else %}<span aria-hidden="true">&#127918;</span>{% endif %}{% endmacro %}
