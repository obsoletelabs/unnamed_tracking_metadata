{# Shared edit/new form fields. `v` holds current values; `new` adds the title/provider-id inputs. #}
<label for="title">Title{% if not new %} <span class="hint">(leave unchanged if correct)</span>{% endif %}</label>
<input id="title" type="text" name="title" value="{{ v.get('title', '') }}" maxlength="500" {% if new %}required{% endif %}>
<label for="release_date">Release date <span class="hint">YYYY-MM-DD</span></label>
<input id="release_date" type="text" name="release_date" value="{{ v.get('release_date', '') }}" pattern="\d{4}-\d{2}-\d{2}" maxlength="10" placeholder="2020-09-17">
<div class="cols"><div>
<label for="developer">Developer</label><input id="developer" type="text" name="developer" value="{{ v.get('developer', '') }}" maxlength="200">
</div><div>
<label for="publisher">Publisher</label><input id="publisher" type="text" name="publisher" value="{{ v.get('publisher', '') }}" maxlength="200">
</div></div>
<label for="series">Series</label><input id="series" type="text" name="series" value="{{ v.get('series', '') }}" maxlength="200">
<label for="description">Description</label><textarea id="description" name="description" maxlength="20000">{{ v.get('description', '') }}</textarea>
<div class="cols"><div>
<label for="platforms">Platforms <span class="hint">one per line</span></label><textarea id="platforms" name="platforms">{{ (v.get('platforms') or [])|join('\n') }}</textarea>
</div><div>
<label for="tags">Genres / tags <span class="hint">one per line</span></label><textarea id="tags" name="tags">{{ (v.get('tags') or [])|join('\n') }}</textarea>
</div><div>
<label for="features">Features <span class="hint">one per line</span></label><textarea id="features" name="features">{{ (v.get('features') or [])|join('\n') }}</textarea>
</div></div>
