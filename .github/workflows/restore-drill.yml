name: Compose restore drill
# Issue #27: back up and restore the shipped authority compose stack (PostgreSQL + migrate + Atlas + backup
# service) with real containers. Weekly, on demand, and on pull requests that touch the image, the stack,
# backups or the drill itself. The in-process archive drill (tools/restore_drill.py) stays in CI.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - deploy/authority/**
      - atlas/backup.py
      - atlas/cli.py
      - atlas/migrations/**
      - tools/compose_restore_drill.py
      - .github/workflows/restore-drill.yml
permissions: { contents: read }
concurrency:
  group: restore-drill-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image from this commit
        run: docker build -t atlas-drill:ci .
      - name: Back up, destroy and restore the authority stack (Atlas archive and pg_dump paths)
        run: python3 -I tools/compose_restore_drill.py --image atlas-drill:ci --output compose-restore.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-restore-drill
          path: compose-restore.json
          if-no-files-found: ignore
