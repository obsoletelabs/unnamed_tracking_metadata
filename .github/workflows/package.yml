name: Python package

on:
  push:
    branches: [main, v2]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Write the build manifest before packaging (C16 10.4), so the wheel ships it
        run: uv run python tools/write_build_manifest.py
      - run: uv build --wheel --sdist -o dist
      - name: Install the wheel into a clean environment and start it
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/atlas selfcheck
          cd "$(mktemp -d)"
          ATLAS_DATABASE_URL=sqlite:///./a.db /tmp/venv/bin/atlas migrate
          ATLAS_DATABASE_URL=sqlite:///./a.db /tmp/venv/bin/atlas serve --port 8000 &
          for i in $(seq 30); do curl -fs localhost:8000/api/v2/health && break; sleep 1; done
          curl -fs localhost:8000/ >/dev/null && curl -fs localhost:8000/static/app.css >/dev/null
          curl -fs localhost:8000/api/v2/health | grep -q '"build"'
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
      - name: Client API fixtures release asset (CONTRACT-C15 section 9.3)
        run: |
          uv sync --frozen
          version="0.0.0+${GITHUB_SHA::12}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          uv run python tools/export_client_fixtures.py --out "$RUNNER_TEMP/client-fixtures" --archive client-dist --version "$version"
          # the committed fixtures must be what this commit generates (the test suite checks it too)
          diff -r contracts/client-fixtures "$RUNNER_TEMP/client-fixtures"
      - uses: actions/upload-artifact@v4
        with:
          name: client-fixtures
          path: client-dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: client-fixtures
          path: dist
      - name: Attach the wheel, sdist and client fixtures (client-fixtures-<version>.tar.gz + .sha256) to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
