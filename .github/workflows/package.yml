name: Python package

on:
  push:
    branches: [main, v2]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build --wheel --sdist -o dist
      - name: Install the wheel into a clean environment and start it
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd "$(mktemp -d)"
          ATLAS_DATABASE_URL=sqlite:///./a.db /tmp/venv/bin/atlas migrate
          ATLAS_DATABASE_URL=sqlite:///./a.db /tmp/venv/bin/atlas serve --port 8000 &
          for i in $(seq 30); do curl -fs localhost:8000/api/v2/health && break; sleep 1; done
          curl -fs localhost:8000/ >/dev/null && curl -fs localhost:8000/static/app.css >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - name: Attach the wheel and sdist to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
