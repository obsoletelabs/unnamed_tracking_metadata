name: CI
on:
  push: { branches: [main, v2] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: atlas }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      ATLAS_TEST_PG_URL: postgresql+psycopg://postgres:pw@localhost:5432/atlas
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check atlas tests tools e2e
      - run: uv run pytest -q
      - name: Multi-authority HTTP and restore drills
        run: |
          uv run python -m tools.multinode_drill --postgres-admin-url "$ATLAS_TEST_PG_URL" --output topology-postgres.json
          uv run python -m tools.restore_drill --postgres-admin-url "$ATLAS_TEST_PG_URL" --output restore-postgres.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-drill-results
          path: |
            topology-postgres.json
            restore-postgres.json
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Browser end-to-end tests (desktop and mobile)
        run: npm test
        working-directory: e2e
        env:
          CI: "true"
          E2E_SCREENSHOT_DIR: ${{ github.workspace }}/e2e/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/screenshots
          if-no-files-found: ignore
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t atlas:ci .
      - name: Smoke test
        run: |
          docker run -d --name atlas -p 8000:8000 -e ATLAS_ROLE=local atlas:ci
          for i in $(seq 30); do curl -fs localhost:8000/api/v2/health && exit 0; sleep 1; done
          docker logs atlas; exit 1
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv export --frozen --no-dev --no-emit-project -o req.txt && uvx pip-audit -r req.txt --no-deps --disable-pip
