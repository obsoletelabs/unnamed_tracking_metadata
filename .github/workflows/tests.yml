name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m compileall -q app
      - run: python -m pytest -q
      - name: Build container image
        run: docker build -t atlas-metadata:test .
      - name: Smoke-test the container
        run: |
          docker run -d --name atlas-metadata-smoke -p 127.0.0.1:8000:8000 \
            -e DATABASE_URL=sqlite:////tmp/atlas-smoke.db \
            -e UPLOAD_DIR=/tmp/atlas-smoke-uploads \
            -e SESSION_SECRET=test-only-session-secret \
            atlas-metadata:test
          trap 'docker logs atlas-metadata-smoke || true; docker rm -f atlas-metadata-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              curl --fail --silent http://127.0.0.1:8000/login >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy in 30 seconds"
          exit 1
